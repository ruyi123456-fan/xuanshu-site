<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>💰 支付确认·自动交付</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC',sans-serif}
body{background:#080a14;color:#c8cce0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
h1{font-size:24px;background:linear-gradient(135deg,#4ade80,#4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{font-size:13px;color:#667;margin-bottom:24px}
.panel{background:rgba(14,18,34,0.95);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:20px;width:100%;max-width:500px;margin-bottom:14px}
.panel h2{font-size:15px;color:#ccc;margin-bottom:12px}
.row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.row label{font-size:12px;color:#889;min-width:60px}
.row input{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px 12px;color:#ccc;font-size:13px;outline:none}
.row input:focus{border-color:rgba(74,222,128,0.3)}
.btn{width:100%;padding:14px 0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;border:none;margin-top:8px;transition:all .15s}
.btn-confirm{background:linear-gradient(135deg,#4ade80,#22c55e);color:#000}
.btn-confirm:hover{opacity:.9}
.btn-confirm:disabled{opacity:.4;cursor:not-allowed}
.log{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;font-size:11px;color:#889;line-height:1.6}
.log .ok{color:#4ade80}.log .err{color:#f46}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(14,18,34,0.97);border:1px solid rgba(74,222,128,0.2);border-radius:8px;padding:12px 24px;font-size:13px;color:#4ade80;z-index:999;display:none}
select{background:rgba(14,18,34,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:8px 12px;color:#ccc;font-size:13px;flex:1;outline:none}
</style>
</head>
<body>

<h1>💰 支付确认 · 自动交付</h1>
<div class="sub">收到微信到账通知 → 选产品填客户 → 一键交付</div>

<!-- 选择产品 -->
<div class="panel">
<h2>📦 选择产品</h2>
<div class="row">
<label>产品</label>
<select id="productSelect" onchange="onProductChange()">
<option value="">— 选择产品 —</option>
</select>
</div>
<div id="productInfo" style="font-size:11px;color:#667;margin-top:4px"></div>
</div>

<!-- 客户信息 -->
<div class="panel">
<h2>👤 客户信息</h2>
<div class="row">
<label>客户名</label>
<input id="customerName" placeholder="微信昵称/姓名">
</div>
<div class="row">
<label>邮箱</label>
<input id="customerEmail" placeholder="选填·用于发送交付文件">
</div>
<div class="row">
<label>金额</label>
<input id="amount" placeholder="¥29.9" value="¥29.9">
</div>
<div class="row">
<label>备注</label>
<input id="note" placeholder="选填">
</div>
</div>

<!-- 交付按钮 -->
<button class="btn btn-confirm" id="deliverBtn" onclick="confirmAndDeliver()">
✅ 确认收款·自动交付
</button>

<!-- 交付日志 -->
<div class="panel" style="margin-top:14px">
<h2>📋 交付记录</h2>
<div class="log" id="deliveryLog">
<span style="color:#556">等待交付...</span>
</div>
</div>

<!-- 今日统计 -->
<div class="panel" style="margin-top:8px">
<h2>📊 今日统计</h2>
<div style="display:flex;gap:20px;font-size:12px">
<div>今日交付: <span id="todayCount" style="color:#4ade80;font-weight:700">0</span></div>
<div>今日收入: <span id="todayRevenue" style="color:#f84;font-weight:700">¥0</span></div>
<div>总客户: <span id="totalCustomers" style="color:#4bf;font-weight:700">0</span></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ 自动扫描产品目录 ═══
var PRODUCTS = [];
var DELIVERY_LOG = JSON.parse(localStorage.getItem('xuanshu_delivery_log') || '[]');

function scanProducts() {
  // 扫描产品目录下的落地页
  var prodDir = '/Users/a1/Desktop/obs对话专用/产品/';
  // 先用已知产品
  PRODUCTS = [
    {name:'AI效率诊断', file:'落地页_AI效率诊断.html', delivery:'交付_AI效率诊断.py'},
    {name:'AI写作助手', file:'落地页_AI写作助手.html', delivery:'交付_AI写作助手.py'},
    {name:'AI提示词模板库', file:'落地页_全自动_AI提示词工程模板库.html', delivery:'交付_全自动_AI提示词工程模板库.py'},
  ];
  
  var sel = document.getElementById('productSelect');
  PRODUCTS.forEach(function(p, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });
}

function onProductChange() {
  var idx = document.getElementById('productSelect').value;
  if (idx === '') return;
  var p = PRODUCTS[parseInt(idx)];
  document.getElementById('productInfo').innerHTML = 
    '📄 落地页: ' + p.file + '<br>📦 交付脚本: ' + p.delivery;
  document.getElementById('amount').value = '¥29.9';
}

function confirmAndDeliver() {
  var idx = document.getElementById('productSelect').value;
  var name = document.getElementById('customerName').value.trim();
  var email = document.getElementById('customerEmail').value.trim();
  var amount = document.getElementById('amount').value.trim();
  
  if (!idx) { toast('请选择产品', '#f46'); return; }
  if (!name) { toast('请输入客户名', '#f46'); return; }
  
  var product = PRODUCTS[parseInt(idx)];
  var btn = document.getElementById('deliverBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 交付中...';
  
  toast('💰 确认收款·启动交付...', '#4ade80');
  
  // 记录交易
  var record = {
    time: new Date().toISOString(),
    product: product.name,
    customer: name,
    email: email,
    amount: amount,
    status: 'delivering'
  };
  
  addLog('💰 <span class="ok">收到付款</span>: ' + name + ' · ' + amount + ' · ' + product.name);
  
  // 执行交付脚本
  var scriptPath = '/Users/a1/Desktop/obs对话专用/产品/' + product.delivery;
  var cmd = 'python3 "' + scriptPath + '" "' + name + '" "' + email + '"';
  
  addLog('📦 执行交付: ' + product.delivery);
  
  // 通过fetch调用本地服务
  fetch('http://127.0.0.1:8897/dispatch', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      task: '[自动交付] 产品:' + product.name + ' 客户:' + name + ' 邮箱:' + email + ' 金额:' + amount,
      line: 'auto',
      delivery: {
        script: scriptPath,
        customer: name,
        email: email,
        product: product.name,
        amount: amount
      }
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    record.status = 'delivered';
    addLog('✅ <span class="ok">交付完成</span>: ' + name + ' → ' + product.name);
    record.deliveredAt = new Date().toISOString();
    saveRecord(record);
    updateStats();
    resetForm();
  })
  .catch(function() {
    // 8897离线·记录但标记待交付
    record.status = 'confirmed_pending';
    addLog('⚠️ 8897离线·已记录·手动运行: python3 ' + product.delivery + ' "' + name + '"');
    saveRecord(record);
    updateStats();
    resetForm();
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = '✅ 确认收款·自动交付';
  });
}

function addLog(msg) {
  var log = document.getElementById('deliveryLog');
  var time = new Date().toLocaleTimeString();
  log.innerHTML = '<div>[' + time + '] ' + msg + '</div>' + log.innerHTML;
  if (log.children.length > 20) log.removeChild(log.lastChild);
}

function saveRecord(record) {
  DELIVERY_LOG.unshift(record);
  if (DELIVERY_LOG.length > 100) DELIVERY_LOG.pop();
  localStorage.setItem('xuanshu_delivery_log', JSON.stringify(DELIVERY_LOG));
}

function updateStats() {
  var today = new Date().toDateString();
  var todayDeliveries = DELIVERY_LOG.filter(function(r) {
    return new Date(r.time).toDateString() === today && r.status !== 'confirmed_pending';
  });
  var todayRevenue = todayDeliveries.reduce(function(sum, r) {
    var amt = parseFloat(r.amount.replace('¥','')) || 29.9;
    return sum + amt;
  }, 0);
  var allCustomers = new Set(DELIVERY_LOG.map(function(r) { return r.customer; }));
  
  document.getElementById('todayCount').textContent = todayDeliveries.length;
  document.getElementById('todayRevenue').textContent = '¥' + todayRevenue.toFixed(0);
  document.getElementById('totalCustomers').textContent = allCustomers.size;
}

function resetForm() {
  document.getElementById('customerName').value = '';
  document.getElementById('customerEmail').value = '';
  document.getElementById('note').value = '';
}

function toast(msg, color) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.color = color || '#4ade80';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}

// 初始化
scanProducts();
updateStats();

// 加载历史记录
DELIVERY_LOG.forEach(function(r) {
  var icon = r.status === 'delivered' ? '✅' : '⚠️';
  addLog(icon + ' ' + r.customer + ' · ' + r.amount + ' · ' + r.product + ' (' + new Date(r.time).toLocaleString() + ')');
});

// 快捷键
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.metaKey) {
    e.preventDefault();
    confirmAndDeliver();
  }
});
</script>
</body>
</html>
