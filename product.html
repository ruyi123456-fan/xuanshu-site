<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI简历优化器 - 在线购买</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC',sans-serif}
body{background:linear-gradient(135deg,#0a0d1a,#1a1040);color:#e0e0f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.hero{text-align:center;padding:50px 20px 30px;max-width:700px}
.hero h1{font-size:32px;background:linear-gradient(135deg,#f84,#f4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.hero p{font-size:16px;color:#a0a8c0}
.features{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:0 auto 24px}
.feature{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:14px;font-size:13px}
.price-box{background:rgba(255,136,68,0.08);border:2px solid rgba(255,136,68,0.3);border-radius:14px;padding:20px;text-align:center;max-width:340px;margin:0 auto 20px}
.price{font-size:38px;font-weight:800;color:#f84}
.btn{display:block;width:280px;margin:8px auto;padding:14px 0;background:linear-gradient(135deg,#f84,#f4a);color:#fff;text-align:center;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;border:none;text-decoration:none}
.btn:hover{opacity:.9}
.email-input{display:block;width:280px;margin:8px auto;padding:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#ccc;font-size:13px;text-align:center;outline:none}
.email-input:focus{border-color:rgba(255,136,68,0.3)}
.success{display:none;text-align:center;padding:30px}
.success .icon{font-size:64px;margin-bottom:16px}
.success h2{color:#4ade80;margin-bottom:8px}
.success p{color:#889;font-size:14px}
.footer{text-align:center;padding:20px;color:#556;font-size:11px}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px}
.badge{font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(74,222,128,0.08);color:#4ade80}
</style>
</head>
<body>
<div class="hero" id="hero">
<h1>📝 AI简历优化器</h1>
<p>粘贴简历 → AI分析评分 → 发现问题 → 生成优化版本</p>
</div>

<div class="features" id="features">
<div class="feature">✅ AI智能评分·找出所有弱点</div>
<div class="feature">✅ ATS关键词分析·提高通过率</div>
<div class="feature">✅ 自动生成优化版本·复制即用</div>
<div class="feature">✅ 本地运行·隐私安全·不上传</div>
</div>

<div class="price-box" id="priceBox">
<div style="color:#889;font-size:12px;margin-bottom:4px">一次性购买·永久使用</div>
<div class="price">¥29.9</div>
<div style="color:#889;font-size:12px;margin-top:4px">7天无理由退款</div>
</div>

<input class="email-input" id="customerEmail" placeholder="输入邮箱·用于接收产品" type="email">

<a class="btn" id="payBtn" href="#" onclick="goPay(event)">
💳 在线支付 ¥29.9
</a>

<div class="badges">
<span class="badge">🔒 Stripe安全支付</span>
<span class="badge">📧 自动发送邮箱</span>
<span class="badge">🔄 7天退款</span>
</div>

<div class="success" id="successMsg">
<div class="icon">✅</div>
<h2>支付成功！</h2>
<p id="successEmail"></p>
<p style="color:#667;font-size:12px;margin-top:8px">产品正在发送到您的邮箱·5分钟内送达</p>
<p style="color:#667;font-size:11px;margin-top:4px">没收到？检查垃圾邮件或联系客服</p>
</div>

<div class="footer">© 2026 一人公司 · Stripe安全支付 · 全自动AI驱动</div>

<script>
var PAY_LINK = 'https://buy.stripe.com/test_eVq3cv9H6eod7NO4iffAc00';

function goPay(e){
  e.preventDefault();
  var email = document.getElementById('customerEmail').value.trim();
  if(!email){ alert('请先输入邮箱地址'); return; }
  
  // 把邮箱存到URL参数·支付成功后Stripe带回
  var link = PAY_LINK + '?prefilled_email=' + encodeURIComponent(email);
  window.location.href = link;
}

// 支付成功返回
var params = new URLSearchParams(window.location.search);
if(params.get('paid') === '1'){
  document.getElementById('hero').style.display = 'none';
  document.getElementById('features').style.display = 'none';
  document.getElementById('priceBox').style.display = 'none';
  document.getElementById('payBtn').style.display = 'none';
  document.getElementById('customerEmail').style.display = 'none';
  document.getElementById('successMsg').style.display = 'block';
  document.getElementById('successEmail').textContent = '📧 产品已发送至您的邮箱';
  
  // 自动触发交付通知
  fetch('http://127.0.0.1:8897/dispatch', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      task: '[Stripe支付成功·自动交付] 产品:AI简历优化器',
      line: 'auto'
    })
  }).catch(function(){});
}
</script>
</body>
</html>
