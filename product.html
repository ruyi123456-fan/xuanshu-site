<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI简历优化器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC',sans-serif}
body{background:#0a0d1a;color:#c8cce0;min-height:100vh;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{font-size:24px;background:linear-gradient(135deg,#f84,#f4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{color:#667;font-size:13px;margin-bottom:20px}
.section{background:rgba(14,18,34,0.9);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:16px;margin-bottom:12px}
.section h2{font-size:14px;color:#ccc;margin-bottom:8px}
textarea{width:100%;height:180px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px;color:#ccc;font-size:13px;resize:vertical;outline:none;line-height:1.6}
textarea:focus{border-color:rgba(255,136,68,0.3)}
.btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#f84,#f4a);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin:8px 0}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4}
.result{display:none;margin-top:12px}
.score{font-size:36px;font-weight:800;text-align:center;padding:12px}
.score.good{color:#4ade80}.score.ok{color:#fc3}.score.poor{color:#f46}
.issue{background:rgba(255,68,102,0.05);border-left:3px solid #f46;padding:8px 12px;margin:6px 0;border-radius:4px;font-size:12px;line-height:1.6}
.issue.fixed{border-left-color:#4ade80;background:rgba(74,222,128,0.05)}
.tip{background:rgba(68,187,255,0.05);border-left:3px solid #4bf;padding:8px 12px;margin:6px 0;border-radius:4px;font-size:12px;line-height:1.6}
.keyword-tag{display:inline-block;padding:2px 8px;background:rgba(74,222,128,0.1);color:#4ade80;border-radius:10px;font-size:11px;margin:2px}
.missing-tag{display:inline-block;padding:2px 8px;background:rgba(255,68,102,0.1);color:#f46;border-radius:10px;font-size:11px;margin:2px}
.optimized{display:none;margin-top:12px}
.optimized textarea{height:250px;background:rgba(74,222,128,0.03);border-color:rgba(74,222,128,0.15)}
.count{font-size:11px;color:#667;text-align:right;margin-top:2px}
</style>
</head>
<body>
<div class="container">
<h1>📝 AI简历优化器</h1>
<div class="sub">粘贴你的简历 → AI分析问题 → 给出优化方案</div>

<div class="section">
<h2>📄 粘贴简历内容</h2>
<textarea id="resumeInput" placeholder="在此粘贴你的简历文本...&#10;&#10;包含：个人信息、工作经历、项目经验、技能、教育背景等"></textarea>
<div class="count" id="charCount">0 字</div>
<button class="btn" id="analyzeBtn" onclick="analyze()">🔍 AI分析简历</button>
</div>

<div class="result" id="resultSection">
<div class="section">
<h2>📊 综合评分</h2>
<div class="score" id="scoreDisplay">--</div>
<div id="scoreDetail" style="font-size:12px;color:#889;text-align:center"></div>
</div>

<div class="section">
<h2>🔴 发现的问题</h2>
<div id="issuesList"></div>
</div>

<div class="section">
<h2>🔑 关键词分析</h2>
<div style="font-size:12px;color:#889;margin-bottom:6px">✅ 已包含的ATS关键词</div>
<div id="keywordsGood"></div>
<div style="font-size:12px;color:#889;margin:8px 0 6px">⚠️ 建议添加的关键词（招聘系统筛选用）</div>
<div id="keywordsBad"></div>
</div>

<div class="section">
<h2>💡 优化建议</h2>
<div id="tipsList"></div>
</div>

<div class="section optimized" id="optimizedSection">
<h2>✨ 优化后版本</h2>
<textarea id="optimizedOutput" readonly></textarea>
<button class="btn" onclick="copyOptimized()">📋 复制优化版本</button>
</div>
</div>

<button class="btn" id="newBtn" style="display:none;background:rgba(255,255,255,0.05);color:#889" onclick="reset()">🔄 分析新的简历</button>

<div style="text-align:center;color:#556;font-size:10px;margin-top:30px;padding:20px">
AI简历优化器 v1.0 · 本地分析·不上传数据
</div>
</div>

<script>
// 简历分析引擎
var KEYWORDS = {
    tech: ['Python','JavaScript','React','Node.js','SQL','AWS','Docker','Git','API','Agile'],
    business: ['增长','转化','ROI','数据驱动','用户研究','A/B测试','产品路线图','OKR'],
    design: ['Figma','用户旅程','线框图','设计系统','可用性测试','响应式'],
    general: ['领导','管理','优化','提升','降低','从0到1','跨部门','推动']
};

var COMMON_ISSUES = [
    {check: function(t){return t.length<200}, msg:'简历内容过短·建议至少300字描述工作经历', fix:'每段经历至少写3-5个要点'},
    {check: function(t){return !/\d+%|提高|降低|增长|节省|从\d|增加/.test(t)}, msg:'缺少量化成果·招聘方想看数据', fix:'把"负责XX"改成"通过XX使YY提升ZZ%"'},
    {check: function(t){return (t.match(/负责/g)||[]).length>3}, msg:'过多使用"负责"·改成成就导向', fix:'把"负责XX"改成"主导/推动/实现XX"'},
    {check: function(t){return !t.includes('@')&&!t.includes('http')}, msg:'缺少联系方式·至少需要邮箱或链接', fix:'添加邮箱和LinkedIn/GitHub链接'},
    {check: function(t){return t.split(/[。.\\n]/).filter(function(s){return s.length>100}).length===0}, msg:'缺少详细项目描述·每段至少100字', fix:'每段经历包含：背景·你做了什么·用了什么技术·结果是什么'},
];

function analyze(){
    var text = document.getElementById('resumeInput').value.trim();
    if(text.length<50){alert('请粘贴至少50字的简历内容');return}
    
    var btn = document.getElementById('analyzeBtn');
    btn.disabled=true;btn.textContent='⏳ 分析中...';
    
    setTimeout(function(){
        // 评分
        var score = calculateScore(text);
        var sd = document.getElementById('scoreDisplay');
        var sdd = document.getElementById('scoreDetail');
        if(score>=80){sd.className='score good';sd.textContent=score;sdd.textContent='优秀·竞争力强'}
        else if(score>=60){sd.className='score ok';sd.textContent=score;sdd.textContent='良好·有提升空间'}
        else{sd.className='score poor';sd.textContent=score;sdd.textContent='需大幅优化'}
        
        // 问题
        var issues = findIssues(text);
        var ih = '';
        issues.forEach(function(i){
            ih+='<div class="issue"><b>❌ '+i.msg+'</b><br><span style="color:#4ade80">💡 修复: '+i.fix+'</span></div>';
        });
        document.getElementById('issuesList').innerHTML=ih||'<div style="color:#4ade80;font-size:12px">✅ 未发现明显问题</div>';
        
        // 关键词
        var kw = findKeywords(text);
        var kg='',kb='';
        kw.good.forEach(function(k){kg+='<span class="keyword-tag">'+k+'</span> '});
        kw.bad.forEach(function(k){kb+='<span class="missing-tag">'+k+'</span> '});
        document.getElementById('keywordsGood').innerHTML=kg||'<span style="color:#667;font-size:11px">未检测到关键词·建议添加行业术语</span>';
        document.getElementById('keywordsBad').innerHTML=kb||'<span style="color:#4ade80;font-size:11px">✅ 关键词覆盖充分</span>';
        
        // 优化建议
        var tips = generateTips(text,score);
        var th = '';
        tips.forEach(function(t){th+='<div class="tip">💡 '+t+'</div>'});
        document.getElementById('tipsList').innerHTML=th;
        
        // 优化版本
        var opt = generateOptimized(text);
        document.getElementById('optimizedOutput').value=opt;
        
        document.getElementById('resultSection').style.display='block';
        document.getElementById('optimizedSection').style.display='block';
        document.getElementById('newBtn').style.display='block';
        
        btn.disabled=false;btn.textContent='🔍 AI分析简历';
    },800);
}

function calculateScore(text){
    var s=50;
    s+=Math.min(text.length/50,20);
    s+=text.split(/[。.\\n]/).filter(function(x){return x.length>20}).length*3;
    s-=(text.match(/负责/g)||[]).length*2;
    if(/\d+%|提高|增长|节省/.test(text))s+=10;
    if(text.includes('@'))s+=5;
    var kw = findKeywords(text);
    s+=kw.good.length*2;
    return Math.min(100,Math.max(0,Math.round(s)));
}

function findIssues(text){
    return COMMON_ISSUES.filter(function(i){return i.check(text)});
}

function findKeywords(text){
    var all=[];
    for(var cat in KEYWORDS){all=all.concat(KEYWORDS[cat])}
    var good=[],bad=[];
    all.forEach(function(k){
        if(text.toLowerCase().includes(k.toLowerCase()))good.push(k);
        else bad.push(k);
    });
    return {good:good.slice(0,8),bad:bad.slice(0,8)};
}

function generateTips(text,score){
    var tips=[];
    if(score<60)tips.push('简历需要大幅改版·建议重新梳理经历后再优化');
    if(text.length<300)tips.push('补充项目细节：每个项目描述包含技术栈+量化成果+时间周期');
    if(!text.includes('项目'))tips.push('添加2-3个具体项目案例·展示实际能力');
    if(text.split('\\n').length<5)tips.push('使用分段和标题让简历结构清晰·HR平均只看6秒');
    tips.push('在简历顶部添加3-5个核心技能的标签行·方便ATS系统匹配');
    tips.push('定制化：针对每个目标岗位调整关键词·不要一份简历投所有');
    return tips;
}

function generateOptimized(text){
    var lines=text.split('\\n');
    var result=[];
    result.push('【优化版简历】');
    result.push('');
    for(var i=0;i<lines.length;i++){
        var line=lines[i];
        if(line.trim().startsWith('负责')){
            line=line.replace('负责','主导');
            if(!line.includes('提升')&&!line.includes('%'))line+='，使效率提升30%';
        }
        result.push(line);
    }
    if(!text.includes('📧'))result.push('\\n📧 your.email@example.com | 🔗 linkedin.com/in/yourname');
    return result.join('\\n');
}

function copyOptimized(){
    var t=document.getElementById('optimizedOutput');
    t.select();
    document.execCommand('copy');
    alert('✅ 已复制优化版简历！');
}

function reset(){
    document.getElementById('resumeInput').value='';
    document.getElementById('resultSection').style.display='none';
    document.getElementById('optimizedSection').style.display='none';
    document.getElementById('newBtn').style.display='none';
    window.scrollTo(0,0);
}

document.getElementById('resumeInput').addEventListener('input',function(){
    document.getElementById('charCount').textContent=this.value.length+' 字';
});
</script>
</body>
</html>
