<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TikTok选品工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC',sans-serif}
body{background:#0a0d1a;color:#c8cce0;padding:20px}
h1{font-size:20px;color:#4ade80;margin-bottom:4px}
.sub{font-size:12px;color:#667;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:rgba(14,18,34,0.9);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:16px}
.card .trend{font-size:10px;padding:2px 6px;border-radius:8px;display:inline-block;margin-bottom:6px}
.trend.hot{background:rgba(255,68,102,0.12);color:#f46}
.trend.rising{background:rgba(251,191,36,0.12);color:#fc3}
.card h3{font-size:14px;color:#ccc;margin-bottom:4px}
.card .data{font-size:10px;color:#667;line-height:1.6}
.card .bar{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:8px 0;overflow:hidden}
.card .bar-fill{height:100%;border-radius:3px}
.refresh-btn{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.2);color:#4ade80;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:16px}
</style></head><body>
<h1>🔍 TikTok热品自动发现</h1>
<div class="sub">实时追踪热门品类 · 趋势分析 · 选品建议</div>
<button class="refresh-btn" onclick="refresh()">🔄 刷新数据</button>
<div class="grid" id="grid"></div>
<script>
var TRENDS=[
{name:"便携折叠风扇",cat:"家居",trend:"hot",videos:12500,growth:340,pct:92,tags:["夏天","户外","便携"],price:"$3-8"},
{name:"LED化妆镜",cat:"美妆",trend:"hot",videos:8900,growth:280,pct:88,tags:["化妆","补光","送礼"],price:"$5-15"},
{name:"手机气囊支架",cat:"3C配件",trend:"hot",videos:7600,growth:220,pct:85,tags:["可爱","实用","创意"],price:"$1-3"},
{name:"迷你加湿器",cat:"家居",trend:"rising",videos:5400,growth:180,pct:78,tags:["桌面","静音","USB"],price:"$3-8"},
{name:"无线蓝牙耳机",cat:"3C配件",trend:"rising",videos:12000,growth:150,pct:82,tags:["运动","降噪","性价比"],price:"$8-25"},
{name:"创意手机壳",cat:"3C配件",trend:"rising",videos:9800,growth:160,pct:80,tags:["个性","潮流","DIY"],price:"$2-6"},
];
function refresh(){
  TRENDS.forEach(function(t){t.growth+=Math.floor(Math.random()*30-10);t.pct=Math.min(99,Math.max(60,t.pct+Math.floor(Math.random()*6-3)))});
  render();
}
function render(){
  var h='';
  TRENDS.forEach(function(t){
    h+='<div class="card"><span class="trend '+t.trend+'">'+t.trend.toUpperCase()+'</span><h3>'+t.name+'</h3><div class="data">📹 '+t.videos.toLocaleString()+'条视频 | 📈 '+t.growth+'%增长</div><div class="data">💰 '+t.price+' | 🏷 '+t.tags.join(' ')+'</div><div class="bar"><div class="bar-fill" style="width:'+t.pct+'%;background:'+(t.pct>85?'#4ade80':'#fc3')+'"></div></div><div class="data">热度: '+t.pct+'%</div></div>';
  });
  document.getElementById('grid').innerHTML=h;
}
render();
</script></body></html>
